<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Facturas · Bosque Conectado</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f0c">
<link rel="apple-touch-icon" href="ICONS/icon-180.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>

<style>
  :root{
    --bg:#0d0f0c;
    --bg-panel:#161913;
    --bg-input:#1e2219;
    --border:#2c3226;
    --gold:#c9a24b;
    --gold-dim:#8a6f38;
    --leaf:#6b8f5a;
    --text:#e9e7dd;
    --text-dim:#9a9a8c;
    --danger:#b5502f;
    --radius:10px;
    --paper:#fdfcf7;
    --ink:#1b1b1b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @font-face{
    font-family:'IBM Plex Sans';
    src:local('IBM Plex Sans');
  }
  header.appbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#12140f,#0d0f0c);
  }
  header.appbar img{height:36px;width:36px;border-radius:8px;}
  header.appbar h1{font-size:16px;letter-spacing:.04em;margin:0;font-weight:600;color:var(--gold);}
  header.appbar span{font-size:11px;color:var(--text-dim);}

  nav.tabs{
    display:flex;
    border-bottom:1px solid var(--border);
    background:var(--bg-panel);
    position:sticky; top:0; z-index:5;
  }
  nav.tabs button{
    flex:1;
    padding:13px 6px;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:12.5px;
    letter-spacing:.03em;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.active{
    color:var(--gold);
    border-bottom:2px solid var(--gold);
  }

  main{max-width:760px;margin:0 auto;padding:16px;padding-bottom:60px;}
  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--gold-dim);
    margin:0 0 12px 0;
    font-weight:600;
  }
  label{
    display:block;
    font-size:11.5px;
    color:var(--text-dim);
    margin:10px 0 4px;
  }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%;
    background:var(--bg-input);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 11px;
    border-radius:7px;
    font-family:inherit;
    font-size:14px;
  }
  input:focus, select:focus, textarea:focus{outline:1px solid var(--gold-dim);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .checkrow{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .checkrow input{width:auto;}
  .checkrow label{margin:0;color:var(--text);}

  button.btn{
    background:var(--gold);
    color:#171400;
    border:none;
    padding:11px 16px;
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    letter-spacing:.02em;
    cursor:pointer;
  }
  button.btn.secondary{
    background:transparent;
    color:var(--gold);
    border:1px solid var(--gold-dim);
  }
  button.btn.danger{
    background:transparent;
    color:var(--danger);
    border:1px solid var(--danger);
  }
  button.btn.small{padding:7px 11px;font-size:12px;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  .cliente-chip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--bg-input);
    border:1px solid var(--border);
    border-radius:7px;
    padding:9px 11px;
    margin-bottom:7px;
    font-size:13px;
  }
  .cliente-chip .info{color:var(--text-dim);font-size:11.5px;}
  .cliente-chip .nombre{color:var(--text);font-weight:600;}

  .linea-card{
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:var(--bg-input);
  }
  .linea-card .lc-top{display:flex;justify-content:space-between;align-items:center;}
  .linea-card .lc-top label{margin:0;}
  .linea-card .in-cant{width:80px;}
  .linea-card .lc-del{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:0 4px;}
  .linea-card .in-desc{
    width:100%;
    min-height:56px;
    resize:vertical;
    font-family:inherit;
    font-size:14px;
    padding:9px 10px;
  }
  .linea-card .lc-bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .linea-card .lc-bottom .out-total{
    display:block;
    padding:10px 11px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:7px;
    color:var(--text-dim);
    font-size:14px;
  }

  .totales{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);text-align:right;font-size:13.5px;}
  .totales div{margin-bottom:5px;color:var(--text-dim);}
  .totales .final{font-size:17px;color:var(--gold);font-weight:700;margin-top:6px;}
  .ivarow{display:flex;justify-content:flex-end;align-items:center;gap:8px;}
  .ivarow input{width:60px;text-align:right;padding:5px 6px;font-size:12.5px;}

  .historial-item{
    background:var(--bg-input);border:1px solid var(--border);border-radius:8px;
    padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .historial-item .num{color:var(--gold);font-weight:700;font-size:14px;}
  .historial-item .meta{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .historial-item .imp{font-size:14px;color:var(--text);}

  .empty{color:var(--text-dim);font-size:12.5px;text-align:center;padding:18px 0;}

  /* ---- Vista de factura (usada tanto en pantalla como para PDF/impresión) ---- */
  #facturaPreview{
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:26px 24px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .fp-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .fp-logo{height:64px;width:64px;border-radius:6px;object-fit:cover;}
  .fp-emisor{text-align:right;font-size:12px;line-height:1.5;}
  .fp-emisor .nombre{font-weight:700;font-size:14px;}
  .fp-rule{border:none;border-top:1.5px solid var(--ink);margin:16px 0;}
  .fp-row2{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .fp-fecha{font-size:12.5px;}
  .fp-numero{
    display:inline-block;margin-top:8px;border:1px solid var(--ink);
    border-radius:4px;padding:4px 10px;font-size:12.5px;font-weight:700;
  }
  .fp-cliente{
    border:1px solid var(--ink);border-radius:10px;padding:10px 16px;
    text-align:center;font-size:12px;line-height:1.5;min-width:230px;
  }
  .fp-cliente .nombre{font-weight:700;font-size:13.5px;}
  table.fp-tabla{width:100%;border-collapse:collapse;margin-top:18px;font-size:12.5px;}
  table.fp-tabla th{
    text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--ink);font-size:11px;
    text-transform:uppercase;letter-spacing:.03em;
  }
  table.fp-tabla td{padding:8px;border-left:1px solid #ccc;}
  table.fp-tabla td:first-child{border-left:none;}
  table.fp-tabla th:nth-child(1),table.fp-tabla td:nth-child(1){width:12%;}
  table.fp-tabla th:nth-child(3),table.fp-tabla td:nth-child(3),
  table.fp-tabla th:nth-child(4),table.fp-tabla td:nth-child(4){width:16%;text-align:right;}
  .fp-totales{margin-top:16px;border-top:1.5px solid var(--ink);padding-top:8px;display:flex;justify-content:flex-end;gap:22px;font-size:13px;}
  .fp-totales b{font-size:14px;}

  @media print{
    @page{ size: A4; margin: 15mm; }
    body *{visibility:hidden;}
    #facturaPreview, #facturaPreview *{visibility:visible;}
    #facturaPreview{position:absolute;top:0;left:0;width:100%;border-radius:0;padding:0;}
  }
</style>
</head>
<body>

<header class="appbar">
  <img src="ICONS/icon-192.png" alt="logo">
  <div>
    <h1>FACTURAS</h1>
    <span>Bosque Conectado</span>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-view="nueva">Nueva Factura</button>
  <button class="tab-btn" data-view="config">Configuración</button>
  <button class="tab-btn" data-view="historial">Historial</button>
</nav>

<main>

  <!-- ============ NUEVA FACTURA ============ -->
  <section id="view-nueva" class="view active">

    <div class="card">
      <h2>Cliente</h2>
      <div id="selectClienteWrap" style="display:none;">
        <label>Elegir cliente guardado</label>
        <select id="selCliente">
          <option value="">— Escribir datos manualmente —</option>
        </select>
      </div>

      <div id="clientePuntualFields">
        <div class="row2">
          <div><label>Nombre / Razón social</label><input type="text" id="cpNombre"></div>
          <div><label>NIF / CIF</label><input type="text" id="cpNif"></div>
        </div>
        <label>Domicilio fiscal</label>
        <input type="text" id="cpDomicilio">
        <div class="row2">
          <div><label>CP + Población</label><input type="text" id="cpCpPoblacion"></div>
          <div><label>Provincia</label><input type="text" id="cpProvincia"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Datos de la factura</h2>
      <div class="row2">
        <div>
          <label>Nº de factura</label>
          <input type="text" id="numFactura">
        </div>
        <div>
          <label>Fecha</label>
          <input type="text" id="fechaFactura" placeholder="dd/mm/aaaa">
        </div>
      </div>
      <div class="checkrow">
        <input type="checkbox" id="chkHoy" checked>
        <label for="chkHoy">Usar fecha de hoy</label>
      </div>
    </div>

    <div class="card">
      <h2>Conceptos</h2>
      <div id="lineasBody"></div>
      <button class="btn secondary small" id="btnAddLinea" type="button">+ Añadir línea</button>

      <div class="totales">
        <div>Subtotal: <span id="txtSubtotal">0,00 €</span></div>
        <div class="ivarow">IVA <input type="number" id="ivaPct" value="21"> % : <span id="txtIva">0,00 €</span></div>
        <div class="final">Total: <span id="txtTotal">0,00 €</span></div>
      </div>
    </div>

    <div class="btnrow">
      <button class="btn" id="btnGuardarFactura">Guardar factura</button>
      <button class="btn secondary" id="btnPdfPreview">Descargar PDF</button>
      <button class="btn secondary" id="btnPrintPreview">Imprimir</button>
    </div>

  </section>

  <!-- ============ CONFIGURACIÓN ============ -->
  <section id="view-config" class="view">

    <div class="card">
      <h2>Mis datos fiscales (emisor)</h2>
      <div class="row2">
        <div><label>Nombre / Razón social</label><input type="text" id="cfgNombre"></div>
        <div><label>NIF / CIF</label><input type="text" id="cfgNif"></div>
      </div>
      <label>Domicilio fiscal</label>
      <input type="text" id="cfgDomicilio">
      <div class="row2">
        <div><label>CP + Población</label><input type="text" id="cfgCpPoblacion"></div>
        <div><label>Provincia</label><input type="text" id="cfgProvincia"></div>
      </div>
      <div class="btnrow"><button class="btn" id="btnGuardarEmisor">Guardar mis datos</button></div>
    </div>

    <div class="card">
      <h2>Numeración</h2>
      <label>Empezar a numerar desde</label>
      <input type="text" id="cfgNumInicio" placeholder="p.ej. 1121">
      <div class="btnrow"><button class="btn secondary" id="btnGuardarNumInicio">Guardar nº inicial</button></div>
      <div class="empty" id="txtUltimoNumero" style="text-align:left;padding:8px 0 0;"></div>
    </div>

    <div class="card">
      <h2>Clientes recurrentes (máx. 5)</h2>
      <div id="listaClientesRecurrentes"></div>
      <div id="formNuevoCliente" style="display:none;">
        <div class="row2">
          <div><label>Nombre / Razón social</label><input type="text" id="ncNombre"></div>
          <div><label>NIF / CIF</label><input type="text" id="ncNif"></div>
        </div>
        <label>Domicilio fiscal</label>
        <input type="text" id="ncDomicilio">
        <div class="row2">
          <div><label>CP + Población</label><input type="text" id="ncCpPoblacion"></div>
          <div><label>Provincia</label><input type="text" id="ncProvincia"></div>
        </div>
        <div class="btnrow">
          <button class="btn" id="btnGuardarNuevoCliente">Guardar cliente</button>
          <button class="btn secondary" id="btnCancelarNuevoCliente">Cancelar</button>
        </div>
      </div>
      <div class="btnrow"><button class="btn secondary small" id="btnMostrarNuevoCliente">+ Añadir cliente</button></div>
    </div>

  </section>

  <!-- ============ HISTORIAL ============ -->
  <section id="view-historial" class="view">
    <div class="card">
      <h2>Facturas emitidas</h2>
      <div id="listaHistorial"><div class="empty">Aún no hay facturas guardadas</div></div>
    </div>
  </section>

</main>

<!-- Plantilla de factura oculta, usada para pantalla previa / PDF / impresión -->
<div id="facturaPreviewWrap" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);display:none;z-index:50;overflow:auto;padding:16px;">
  <div style="max-width:640px;margin:0 auto;">
    <div class="btnrow" style="margin-bottom:10px;">
      <button class="btn secondary small" id="btnCerrarPreview">← Volver</button>
      <button class="btn small" id="btnPdfFromPreview">Descargar PDF</button>
      <button class="btn secondary small" id="btnPrintFromPreview">Imprimir</button>
    </div>
    <div id="facturaPreview"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
